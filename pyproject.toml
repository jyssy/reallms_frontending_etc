[project]
name = "realms-frontend-local"
version = "0.1.0"
description = "Local Django frontend for observing the REALMS orchestration pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=6.1.1,<6.2",
    "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
